[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mempool-monitor"
version = "0.1.0"
description = "Bitcoin mempool monitoring & analysis (mempool.space API)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "weed420" }]
dependencies = [
    "httpx>=0.27,<1",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
mempool-monitor = "mempool_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
